# Prometheus scrape config. Pulls /metrics from the API every 10s.
# In K8s (Phase 9 polish) this becomes ServiceMonitor CRDs auto-discovered
# by kube-prometheus-stack; here the targets are static compose service names.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: pdm-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
        labels:
          service: pdm-api

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
