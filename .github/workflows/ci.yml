# Predictive-maintenance CI:
#  1. lint-and-test: ruff + pytest on every push and PR -- the safety net.
#  2. build-and-push: build the API Docker image + push to GHCR, but only on
#     pushes to main. PRs don't pollute the registry with experimental tags.
#
# Why GHCR over Docker Hub: free for public images, auth comes from the
# built-in GITHUB_TOKEN (no secret management), and the image shows up under
# the repo's Packages tab so reviewers can see it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: predictive-maintenance-api
  # Match the runtime in the Dockerfile, not the laptop. CI's job is to
  # verify what'll actually run in production.
  PYTHON_VERSION: "3.12"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Test (pytest, full suite incl. MLflow integration)
        run: pytest -q

  build-and-push:
    needs: lint-and-test
    # Only publish from main. PRs run lint+test but stop short of pushing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push images to GHCR under the repo owner's namespace.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Image will be published to:
          #   ghcr.io/<owner>/predictive-maintenance-api:latest
          #   ghcr.io/<owner>/predictive-maintenance-api:sha-<short>
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA-native build cache so subsequent runs reuse layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max
